<form method="get" class="row g-2 mb-3 align-items-end">
    <div class="col-auto">
        <div class="btn-group btn-group-sm" role="group">
            <a href="?preset=today" class="btn btn-outline-secondary {% if preset == 'today' %}active{% endif %}">Today</a>
            <a href="?preset=week" class="btn btn-outline-secondary {% if preset == 'week' %}active{% endif %}">This Week</a>
            <a href="?preset=month" class="btn btn-outline-secondary {% if preset == 'month' %}active{% endif %}">This Month</a>
            <a href="?preset=year" class="btn btn-outline-secondary {% if preset == 'year' %}active{% endif %}">This Year</a>
        </div>
    </div>
    <div class="col-auto">
        <label class="form-label small text-muted mb-0">From</label>
        <input type="date" name="date_from" value="{{ date_from }}" class="form-control form-control-sm">
    </div>
    <div class="col-auto">
        <label class="form-label small text-muted mb-0">To</label>
        <input type="date" name="date_to" value="{{ date_to }}" class="form-control form-control-sm">
    </div>
    <div class="col-auto">
        <button class="btn btn-primary btn-sm" type="submit">Apply Custom Range</button>
    </div>
</form>
