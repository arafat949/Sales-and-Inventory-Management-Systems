{% extends 'base_app.html' %}
{% block title %}My Profile - BSIMS{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 640px;">
    <h4 class="mb-3">My Profile</h4>
    <div class="card">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
                </div>
                {% endfor %}
                <button class="btn btn-primary">Save Changes</button>
                <a href="{% url 'accounts:password_change' %}" class="btn btn-outline-secondary">Change Password</a>
                <a href="{% url 'dashboard:index' %}" class="btn btn-link">Back to Dashboard</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
