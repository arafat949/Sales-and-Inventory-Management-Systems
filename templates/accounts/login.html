{% extends 'base.html' %}
{% block title %}Login - BSIMS{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm border-0" style="width: 380px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="fa-solid fa-shop fa-2x text-primary"></i>
                <h4 class="mt-2 mb-0 fw-bold">BSIMS</h4>
                <small class="text-muted">Business Sales &amp; Inventory Management</small>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
